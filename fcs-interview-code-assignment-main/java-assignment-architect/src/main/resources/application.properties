# --- Identity ---
quarkus.application.name=warehouse-fulfilment-architect

# --- HTTP ---
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.host=${QUARKUS_HTTP_HOST:0.0.0.0}

# --- Datasource (prod profile / external DB) ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:quarkus_test}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:quarkus_test}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:15432/quarkus_test}
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
%prod.quarkus.hibernate-orm.sql-load-script=no-file
quarkus.hibernate-orm.log.sql=${QUARKUS_HIBERNATE_ORM_LOG_SQL:true}
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=swagger-ui

# === Observability (Quarkus 3.13.3) ==========================================
# Path A — OpenTelemetry: traces + domain metrics → OTLP gRPC :4317
#           → otelcol-contrib → Prometheus scrape job otelcol (:8889)
#           Traces: collector exports to "debug" only (no Tempo/Jaeger in this submission)
# Path B — Micrometer (primary SLI): JVM/HTTP RED → GET /q/metrics
#           → Prometheus scrape job fcs-fulfilment (:8080)

# --- OpenTelemetry (traces + metrics) ---
quarkus.otel.metrics.enabled=true
quarkus.otel.traces.exporter=cdi
quarkus.otel.metrics.exporter=cdi
quarkus.otel.logs.exporter=none
# OTLP gRPC → otelcol :4317 (okhttp on classpath). Matches host collector receivers.otlp.grpc.
quarkus.otel.exporter.otlp.endpoint=http://127.0.0.1:4317
quarkus.otel.exporter.otlp.traces.endpoint=http://127.0.0.1:4317
quarkus.otel.exporter.otlp.metrics.endpoint=http://127.0.0.1:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.exporter.otlp.traces.protocol=grpc
quarkus.otel.exporter.otlp.metrics.protocol=grpc
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.resource.attributes=deployment.environment=local,service.namespace=fulfilment,service.variant=architect,service.name=warehouse-fulfilment-architect
quarkus.otel.traces.suppress-non-application-uris=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s

quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId},spanId=%X{spanId} [%c{2.}] (%t) %s%e%n

# --- Micrometer → Prometheus text at /q/metrics ---
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

# --- Health → /q/health ---
quarkus.smallrye-health.root-path=/q/health

# Tests: no collector / no scrape surface
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.metrics.enabled=false
%test.quarkus.micrometer.export.prometheus.enabled=false
