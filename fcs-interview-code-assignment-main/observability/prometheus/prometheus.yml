# Standalone Prometheus for FCS interview evaluators (docker-compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: fcs-interview
    monitor: fcs-compose

rule_files:
  - /etc/prometheus/rules/fcs-recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otelcol
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]
    honor_timestamps: true

  # App runs on host (quarkus:dev); Docker Desktop / Linux host-gateway
  - job_name: fcs-fulfilment
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: /q/metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          project: fcs-interview
          app: fulfilment-warehouse
          service: fcs-fulfilment
          env: compose
