# Compose path: Prometheus service name + uid for dashboards.
# The provisioned datasource points to Prometheus inside the compose network.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: Prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
